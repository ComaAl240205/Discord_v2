services:
  postgres:
    image: postgres:17
    container_name: discord_v2_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: discord_user
      POSTGRES_PASSWORD: discord_pass
      POSTGRES_DB: discord_v2
    ports:
      - "5432:5432"
    volumes:
      - discord_v2_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: discord_v2_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  discord_v2_pgdata: